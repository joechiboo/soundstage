[project]
name = "soundstage"
version = "0.1.0"
description = "Turn audio recordings into videos and publish them to YouTube"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "joechiboo", email = "joechiboo@gmail.com" }]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
# YouTube 上傳功能的相依套件（upload 模組完成後啟用）：
#   uv sync --extra upload
upload = [
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.2",
]

[project.scripts]
soundstage = "soundstage.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soundstage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
